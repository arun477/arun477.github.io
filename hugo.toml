baseURL = "https://arun477.github.io/"
title = "Arun Arumugam"
locale = "en"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  description = "Arun Arumugam. Agent engineering: projects and notes."

# The feed lives in content/news/ (where the publishing agent writes) but is served at /feed/.
[permalinks.page]
  news = "/feed/:contentbasename/"

[taxonomies]
  tag = "tags"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  root = true
  rel = "alternate"

[outputs]
  home = ["html", "rss", "llms"]
  section = ["html", "rss"]
  page = ["html", "markdown"]
  taxonomy = ["html"]
  term = ["html"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"]]

[markup.highlight]
  style = "github-dark"

[minify]
  minifyOutput = true
