<ol class="list">
{{ range $i, $p := . }}<li style="--i:{{ $i }}"><a href="{{ .RelPermalink }}" title="{{ .Title }}"><span class="n">{{ partial "icon.html" "post" }}</span><span class="t" style="view-transition-name:t-{{ substr (md5 .RelPermalink) 0 10 }}">{{ .Title }}</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01" }}</time></a></li>
{{ end }}</ol>
